name: inception

# these are common to all containers
x-common: &common
  env_file:
    - .env
  restart: on-failure
  networks:
    - inception_network
  init: true

services:

  nginx:
    <<: *common
    build: requirements/nginx
    env_file:       .env
    ports:
      - "443:443"
    volumes:
      - wp-files:/var/www/html
    depends_on:
      - wordpress
      - website

  mariadb:
    <<: *common
    build: requirements/mariadb
    env_file:       .env
    volumes:
      - mariadb-data:/var/lib/mysql

  wordpress:
    <<: *common
    build: requirements/wordpress
    env_file:      .env
    volumes:
      - wp-files:/var/www/html
    depends_on:
      - mariadb
      - redis

  adminer:
    <<: *common
    build: requirements/bonus/adminer
    ports:
      - 8080:8080
    depends_on:
      - wordpress

  redis:
    <<: *common
    build: requirements/bonus/redis

  ftp:
    <<: *common
    build: requirements/bonus/ftp
    env_file:       .env
    environment:
      - IP_ADDR=${IP_ADDR}
    ports:
      - "21:21"
      - 30000-30009:30000-30009
    volumes:
      - wp-files:/var/www/html

  portainer:
    <<: *common
    build: ./requirements/bonus/portainer/
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - portainer-data:/data
    depends_on:
      - wordpress
    ports:
      - "9443:9443"
  
  website:
    <<: *common
    build: ./requirements/bonus/website/
    ports:
      - "8081:80"
    volumes:
      - website_files:/var/www/website/

  # tor:
  #   <<: *common
  #   build: ./requirements/bonus/tor
  #   ports:
  #     - "80:80"
  #     - "4242:4242"

volumes:
  mariadb-data:
    name: mariadb-data
    driver: local
    driver_opts:
      type: none
      device: ~/data/db-data
      o: bind
  wp-files:
    name: wp-files
    driver: local
    driver_opts:
      type: none
      device: ~/data/wp-files
      o: bind
  portainer-data:
    name: portainer-data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ~/data/portainer
    # website
  website_files:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ~/data/website_data
  
networks:
  inception_network:
    name: inception_network
    driver: bridge