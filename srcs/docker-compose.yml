name: inception

services:

  nginx:
    build: ./requirements/nginx
    env_file:       .env
    ports:
      - "443:443"
    volumes:
      - wd-files:/var/www/html
    networks:
      - inception_network
    depends_on:
      - wordpress
    restart: on-failure

  mariadb:
    build: requirements/mariadb
    env_file:       .env
    networks:
      - inception_network
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
    restart: on-failure

  wordpress:
    build: ./requirements/wordpress
    env_file:      .env
    networks:
      - inception_network
    volumes:
      - wd-files:/var/www/html
    depends_on:
      - mariadb
    restart: on-failure

  adminer:
    image: adminer
    restart: on-failure
    ports:
      - 8080:8080
    networks:
      - inception_network


volumes:
  db-data:
    driver: local
    driver_opts:
      type: none
      device: ~/data/db-data
      o: bind
  wd-files:
    driver: local
    driver_opts:
      type: none
      device: ~/data/wd-files
      o: bind

networks:
  inception_network:
    driver: bridge