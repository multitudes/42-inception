name: inception

services:

  nginx:
    build: ./requirements/nginx
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME}
    ports:
      - "443:443"
    volumes:
      - wd-files:/var/www/html
    networks:
      - inception_network
    depends_on:
      - wordpress
    restart: on-failure

  mariadb:
    build: requirements/mariadb
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    networks:
      - inception_network
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
    restart: on-failure

  wordpress:
    build: ./requirements/wordpress
    environment:
      WORDPRESS_DB_HOST: mariadb:3306
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
    networks:
      - inception_network
    ports:
      - "80:80"
    volumes:
      - wd-files:/var/www/html
    depends_on:
      - mariadb
    restart: on-failure


volumes:
  db-data:
    driver: local
    driver_opts:
      type: none
      device: ~/data/db-data
      o: bind
  wd-files:
    driver: local
    driver_opts:
      type: none
      device: ~/data/wd-files
      o: bind

networks:
  inception_network:
    driver: bridge