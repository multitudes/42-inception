[PHP]
; Basic settings
max_execution_time = 300
max_input_time = 300
memory_limit = 256M
post_max_size = 100M
upload_max_filesize = 100M
date.timezone = UTC

; Error handling and logging
display_errors = On
display_startup_errors = On
log_errors = On
error_log = /var/log/php_errors.log

; File uploads
file_uploads = On
upload_tmp_dir = /tmp

; Session settings
session.save_handler = files
session.save_path = /tmp

; PHP-FPM settings
cgi.fix_pathinfo = 0

; Extensions
extension=mysqli
extension=pdo_mysql
extension=gd
extension=mbstring
extension=xml
extension=zip
extension=openssl
extension=json
extension=phar
extension=dom
extension=session
extension=zlib
extension=curl
extension=iconv
extension=tokenizer
extension=ctype
extension=simplexml
extension=fileinfo
extension=xmlwriter
extension=xmlreader
extension=redis
extension=imagick