volumes:
  db-data:
    driver: local
    driver_opts:
      type: none
      device: ~/data/db-data
      o: bind
  wd-files:
    driver: local
    driver_opts:
      type: none
      device: ~/data/wd-files
      o: bind

  # bonus
  prt-files:
    name: prt
    driver: local
    driver_opts:
      type: none
      device: ~/data/portainer
      o: bind
#   gatsby-data:
